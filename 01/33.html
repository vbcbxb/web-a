<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    
let number = prompt('점수를 입력하세요');

switch (true) {
    case number >= 90:
        alert('A등급입니다');
        break;
    case number >= 80:
        alert('B등급입니다');
        break;
    case number >= 70:
        alert('C등급입니다');
        break;
    case number >= 60:
        alert('D등급입니다');
        break;
    case number >= 50:
        alert('E등급입니다');
        break;
    default:
        alert('F등급입니다');
}

switch( parseInt(number/10)){
    case 10:
    case 9:
        alert('A등급입니다');
        break;
    case 8:
        alert('B등급입니다');
        break;
    case 7:                
        alert('C등급입니다');
        break;
    case 6:
        alert('D등급입니다');
        break;
    default:
        alert('F등급입니다');
}
   
</script>

<body>
    <h1>JS 조건문</h1>
</body>
</html>
